<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="55%" stop-color="#EEF3FC"/>
      <stop offset="100%" stop-color="#FDF6E9"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12294A"/>
      <stop offset="100%" stop-color="#0A1B32"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173357"/>
      <stop offset="100%" stop-color="#0D2242"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0A1B32" flood-opacity="0.10"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C7799"/>
    </marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E0A83C"/>
    </marker>
    <style>
      .h1{font-family:Georgia,'Times New Roman',serif;font-weight:700;fill:#0A1B32}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;fill:#7C93B3}
      .sub{font-size:15px;fill:#5C7799}
      .chip{font-size:11px;font-weight:700;letter-spacing:.14em;fill:#5C7799}
      .lead{font-family:Georgia,'Times New Roman',serif;font-size:25px;font-weight:700;fill:#0A1B32}
      .nt{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;fill:#0A1B32}
      .nd{font-size:14px;fill:#5C7799}
      .code{font-family:'SF Mono',Consolas,monospace;font-size:12px;fill:#8095B2;letter-spacing:.02em}
      .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;fill:#9BAFC9}
      .edge{font-size:11px;font-weight:600;fill:#7C93B3;letter-spacing:.04em}
      .lt{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;fill:#FFFFFF}
      .ld{font-size:14px;fill:#B9CBE4}
      .lcode{font-family:'SF Mono',Consolas,monospace;font-size:12px;fill:#E0A83C;letter-spacing:.06em}
      .lkick{font-size:10px;font-weight:700;letter-spacing:.14em;fill:#E0A83C}
    </style>
  </defs>

  <rect width="1600" height="1000" rx="26" fill="url(#bg)"/>
  <circle cx="1470" cy="90" r="230" fill="#DCE8FB" opacity=".55"/>
  <circle cx="120" cy="960" r="180" fill="#FBEBCB" opacity=".55"/>

  <!-- Header -->
  <text x="64" y="72" class="eyebrow" font-size="12px" font-weight="700" letter-spacing=".16em" fill="#7C93B3">TURN THE GLOBE / SYSTEM MAP</text>
  <text x="62" y="118" class="h1" font-size="42" font-family="Georgia,'Times New Roman',serif" font-weight="700" fill="#0A1B32">Offline content, delivered as a journey.</text>
  <text x="64" y="150" class="sub" font-size="15px" fill="#5C7799">Everything is generated before release. The app only reads what was committed.</text>

  <!-- Flow key -->
  <rect x="1236" y="52" width="300" height="76" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="1258" y="78" class="kicker" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#9BAFC9">FLOW KEY</text>
  <line x1="1258" y1="102" x2="1300" y2="102" stroke="#5C7799" stroke-width="2.4" marker-end="url(#arw)"/>
  <text x="1312" y="106" class="edge" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">product</text>
  <line x1="1400" y1="102" x2="1442" y2="102" stroke="#E0A83C" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arwg)"/>
  <text x="1454" y="106" class="edge" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">support</text>

  <!-- Sidebar -->
  <rect x="64" y="196" width="240" height="736" rx="22" fill="url(#navy)" filter="url(#soft)"/>
  <text x="88" y="232" class="lkick" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#E0A83C">SUPPORTING RAILS</text>
  <text x="88" y="264" class="lt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#FFFFFF">Build with context.</text>
  <text x="88" y="290" class="ld" font-size="14px" fill="#B9CBE4">Never run in the live app.</text>

  <g>
    <rect x="88" y="312" width="192" height="240" rx="18" fill="#FFFFFF" opacity=".07"/>
    <rect x="112" y="336" width="46" height="46" rx="13" fill="#E0A83C" opacity=".18"/>
    <g stroke="#E8B44A" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="126" cy="350" r="5.5"/><circle cx="146" cy="350" r="5.5"/><circle cx="136" cy="370" r="5.5"/>
      <path d="M131 350h10M129 355l5 10M143 355l-5 10"/>
    </g>
    <text x="112" y="424" class="lt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#FFFFFF">Entire</text>
    <text x="112" y="452" class="ld" font-size="14px" fill="#B9CBE4">Repo context, skills</text>
    <text x="112" y="472" class="ld" font-size="14px" fill="#B9CBE4">and workflow, wired</text>
    <text x="112" y="492" class="ld" font-size="14px" fill="#B9CBE4">into every change.</text>
    <text x="112" y="526" class="lkick" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#E0A83C">CONTEXT + WORKFLOW</text>
  </g>

  <g>
    <rect x="88" y="588" width="192" height="240" rx="18" fill="#FFFFFF" opacity=".07"/>
    <rect x="112" y="612" width="46" height="46" rx="13" fill="#5BC6A8" opacity=".18"/>
    <g stroke="#7FDCC0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M135 622l14 5v10c0 8-6 13-14 16-8-3-14-8-14-16v-10z"/>
      <path d="M129 637l4.5 4.5 8-8.5"/>
    </g>
    <text x="112" y="700" class="lt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#FFFFFF">Aikido</text>
    <text x="112" y="728" class="ld" font-size="14px" fill="#B9CBE4">Scans code, deps</text>
    <text x="112" y="748" class="ld" font-size="14px" fill="#B9CBE4">and delivery paths</text>
    <text x="112" y="768" class="ld" font-size="14px" fill="#B9CBE4">for vulnerabilities.</text>
    <text x="112" y="802" class="lkick" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#E0A83C">SECURITY CHECKS</text>
  </g>

  <path d="M304 434h30" stroke="#E0A83C" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arwg)"/>
  <path d="M304 710h30" stroke="#E0A83C" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arwg)"/>

  <!-- BUILD TIME panel -->
  <rect x="340" y="196" width="1196" height="330" rx="22" fill="#FFFFFF" opacity=".85" filter="url(#soft)"/>
  <rect x="364" y="216" width="196" height="26" rx="13" fill="#E8EFFB"/>
  <text x="378" y="234" class="chip" font-size="11px" font-weight="700" letter-spacing=".14em" fill="#5C7799">BUILD TIME / OFFLINE</text>
  <text x="364" y="278" class="lead" font-family="Georgia,'Times New Roman',serif" font-size="25px" font-weight="700" fill="#0A1B32">Generate and commit before anyone visits.</text>

  <!-- node 1 Cala -->
  <g>
    <rect x="364" y="308" width="244" height="164" rx="18" fill="#FFFFFF" stroke="#DDE7F5"/>
    <rect x="388" y="330" width="42" height="42" rx="12" fill="#E8EFFB"/>
    <g stroke="#2F5A8C" stroke-width="2" fill="none">
      <ellipse cx="409" cy="343" rx="10" ry="4"/>
      <path d="M399 343v16c0 2.2 4.5 4 10 4s10-1.8 10-4v-16"/>
      <path d="M399 351c0 2.2 4.5 4 10 4s10-1.8 10-4"/>
    </g>
    <text x="388" y="404" class="nt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#0A1B32">Cala</text>
    <text x="388" y="430" class="nd" font-size="14px" fill="#5C7799">Verified facts for the era.</text>
    <text x="388" y="454" class="code" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#8095B2" letter-spacing=".02em">lib/cala.ts</text>
    <text x="444" y="348" class="kicker" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#9BAFC9">01 / KNOWLEDGE</text>
  </g>
  <path d="M612 390h30" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="628" y="378" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">facts</text>

  <!-- node 2 OpenAI -->
  <g>
    <rect x="654" y="308" width="244" height="164" rx="18" fill="#FFFFFF" stroke="#DDE7F5"/>
    <rect x="678" y="330" width="42" height="42" rx="12" fill="#E8EFFB"/>
    <g stroke="#2F5A8C" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M699 337v24M688 344l22 12M710 344l-22 12"/>
      <circle cx="699" cy="349" r="3.4" fill="#2F5A8C" stroke="none"/>
    </g>
    <text x="734" y="348" class="kicker" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#9BAFC9">02 / NARRATIVE</text>
    <text x="678" y="404" class="nt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#0A1B32">OpenAI</text>
    <text x="678" y="430" class="nd" font-size="14px" fill="#5C7799">Facts become story copy.</text>
    <text x="678" y="454" class="code" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#8095B2" letter-spacing=".02em">lib/openai.ts</text>
  </g>
  <path d="M902 390h30" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="918" y="378" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">copy</text>

  <!-- node 3 Fal -->
  <g>
    <rect x="944" y="308" width="244" height="164" rx="18" fill="#FFFFFF" stroke="#DDE7F5"/>
    <rect x="968" y="330" width="42" height="42" rx="12" fill="#FBEBCB"/>
    <g stroke="#B3801E" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="978" y="340" width="22" height="22" rx="4"/>
      <path d="M978 356l6-6 5 5 4-4 7 7"/>
      <circle cx="993" cy="347" r="2.2"/>
    </g>
    <text x="1024" y="348" class="kicker" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#9BAFC9">03 / GENERATION</text>
    <text x="968" y="404" class="nt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#0A1B32">Fal AI</text>
    <text x="968" y="430" class="nd" font-size="14px" fill="#5C7799">Prompts become visuals.</text>
    <text x="968" y="454" class="code" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#8095B2" letter-spacing=".02em">lib/fal.ts</text>
  </g>
  <path d="M1192 390h30" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="1208" y="378" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">media</text>

  <!-- node 4 static assets -->
  <g>
    <rect x="1234" y="308" width="244" height="164" rx="18" fill="url(#dark)"/>
    <rect x="1258" y="330" width="42" height="42" rx="12" fill="#E0A83C" opacity=".2"/>
    <g stroke="#E8B44A" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M1268 344h22M1268 351h22M1268 358h14"/>
    </g>
    <text x="1314" y="348" class="lkick" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#E0A83C">04 / OUTPUT</text>
    <text x="1258" y="404" class="lt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#FFFFFF">Static assets</text>
    <text x="1258" y="430" class="ld" font-size="14px" fill="#B9CBE4">Committed before deploy.</text>
    <text x="1258" y="454" class="lcode" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#E0A83C" letter-spacing=".06em">scripts/generate.ts</text>
  </g>

  <!-- handoff connector -->
  <path d="M1356 472V664H494v40" fill="none" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <rect x="828" y="650" width="184" height="28" rx="14" fill="#EEF3FC" stroke="#DDE7F5"/>
  <text x="920" y="669" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">COMMITTED CONTENT</text>

  <!-- RUNTIME panel -->
  <rect x="340" y="562" width="1196" height="370" rx="22" fill="#FFFFFF" opacity=".85" filter="url(#soft)"/>
  <rect x="364" y="582" width="182" height="26" rx="13" fill="#E8EFFB"/>
  <text x="378" y="600" class="chip" font-size="11px" font-weight="700" letter-spacing=".14em" fill="#5C7799">RUNTIME / NEXT.JS</text>
  <text x="364" y="640" class="lead" font-family="Georgia,'Times New Roman',serif" font-size="25px" font-weight="700" fill="#0A1B32">Read it back. No live AI calls.</text>

  <!-- r1 content bundle -->
  <g>
    <rect x="364" y="704" width="244" height="184" rx="18" fill="url(#dark)"/>
    <rect x="388" y="726" width="42" height="42" rx="12" fill="#E0A83C" opacity=".2"/>
    <g stroke="#E8B44A" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M409 734l11 6v12l-11 6-11-6v-12z"/>
      <path d="M398 740l11 6 11-6M409 746v12"/>
    </g>
    <text x="444" y="744" class="lkick" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#E0A83C">DATA CONTRACT</text>
    <text x="388" y="806" class="lt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#FFFFFF">Content bundle</text>
    <text x="388" y="832" class="ld" font-size="14px" fill="#B9CBE4">Committed JSON + media.</text>
    <text x="388" y="866" class="lcode" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#E0A83C" letter-spacing=".06em">data/*.json · public/*</text>
  </g>
  <path d="M612 796h30" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="628" y="784" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">read</text>

  <!-- r2 globe -->
  <g>
    <rect x="654" y="704" width="244" height="184" rx="18" fill="#FFFFFF" stroke="#DDE7F5"/>
    <rect x="678" y="726" width="42" height="42" rx="12" fill="#E8EFFB"/>
    <g stroke="#2F5A8C" stroke-width="2" fill="none">
      <circle cx="699" cy="747" r="12"/>
      <ellipse cx="699" cy="747" rx="5" ry="12"/>
      <path d="M687 747h24M689.5 740h19M689.5 754h19"/>
    </g>
    <text x="734" y="744" class="kicker" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#9BAFC9">ENTRY</text>
    <text x="678" y="806" class="nt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#0A1B32">Homepage globe</text>
    <text x="678" y="832" class="nd" font-size="14px" fill="#5C7799">Pick a country and era.</text>
    <text x="678" y="866" class="code" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#8095B2" letter-spacing=".02em">app/page.tsx · three.js</text>
  </g>
  <path d="M902 796h30" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="918" y="784" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">select</text>

  <!-- r3 panorama -->
  <g>
    <rect x="944" y="704" width="244" height="184" rx="18" fill="#FFFFFF" stroke="#DDE7F5"/>
    <rect x="968" y="726" width="42" height="42" rx="12" fill="#E8EFFB"/>
    <g stroke="#2F5A8C" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M989 735l12 21h-24z"/>
      <path d="M983 756h12"/>
    </g>
    <text x="1024" y="744" class="kicker" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#9BAFC9">RENDERER</text>
    <text x="968" y="806" class="nt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#0A1B32">Panorama viewer</text>
    <text x="968" y="832" class="nd" font-size="14px" fill="#5C7799">Media wrapped on a sphere.</text>
    <text x="968" y="866" class="code" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#8095B2" letter-spacing=".02em">panorama-viewer.tsx</text>
  </g>
  <path d="M1192 796h30" stroke="#5C7799" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="1208" y="784" class="edge" text-anchor="middle" font-size="11px" font-weight="600" fill="#7C93B3" letter-spacing=".04em">explore</text>

  <!-- r4 outcome -->
  <g>
    <rect x="1234" y="704" width="244" height="184" rx="18" fill="url(#dark)"/>
    <rect x="1258" y="726" width="42" height="42" rx="12" fill="#E0A83C" opacity=".2"/>
    <g stroke="#E8B44A" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="1268" y="736" width="22" height="22" rx="6"/>
      <path d="M1276 742l8 5-8 5z"/>
    </g>
    <text x="1314" y="744" class="lkick" font-size="10px" font-weight="700" letter-spacing=".14em" fill="#E0A83C">OUTCOME</text>
    <text x="1258" y="806" class="lt" font-family="Georgia,'Times New Roman',serif" font-size="21px" font-weight="700" fill="#FFFFFF">Story + panorama</text>
    <text x="1258" y="832" class="ld" font-size="14px" fill="#B9CBE4">A global view becomes</text>
    <text x="1258" y="852" class="ld" font-size="14px" fill="#B9CBE4">one focused moment.</text>
    <text x="1258" y="878" class="lcode" font-family="'SF Mono',Consolas,monospace" font-size="12px" fill="#E0A83C" letter-spacing=".06em">/story/* · /panorama</text>
  </g>

  <text x="364" y="966" class="nd" font-size="14px" fill="#5C7799">scripts/generate.ts runs offline · the runtime serves only pre-generated JSON, images and panoramas.</text>
  <circle cx="350" cy="961" r="4" fill="#E0A83C"/>
</svg>
